name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Test on Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Check the environment and datasets
        run: python verify_requirements.py

      - name: Verify the algorithms
        run: python verify_quantum.py

      - name: Lint
        run: python -m ruff check .

      - name: Test with coverage
        run: python -m pytest -q --cov --cov-report=term-missing

      - name: Upload the coverage report
        if: matrix.python-version == '3.11'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-html
          path: htmlcov
          retention-days: 7
        continue-on-error: true

  dataset:
    name: Validate the datasets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Confirm the datasets load and validate
        run: python verify_requirements.py

      - name: Confirm the datasets are valid JSON
        run: |
          python - <<'PY'
          import json
          for name in ("data/papers.json", "data/projects.json"):
              with open(name, encoding="utf-8") as handle:
                  document = json.load(handle)
              print(f"{name}: valid JSON")
          PY
