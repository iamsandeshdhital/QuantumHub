services:
  web:
    build: .
    image: quantumhub
    ports:
      - "5000:5000"
    environment:
      HOST: 0.0.0.0
      PORT: "5000"
      DEBUG: "false"
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/api/health').read()"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
